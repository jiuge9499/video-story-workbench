<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视频故事工坊</title><link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=1"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=1"><meta name="theme-color" content="#245cff"><link rel="stylesheet" href="/style.css"></head>
<body><div id="app"><div class="loading">正在打开视频故事工坊…</div></div><div id="toast" role="status"></div><dialog id="new-dialog"><form id="new-form"><span class="eyebrow">NEW STORY</span><h2>开始一个新故事</h2><label>作品名称 / 想讲的主题<input name="title" required maxlength="100" placeholder="例如：为什么刷了很多题，还是不会？" autocomplete="off"></label><div class="row end"><button type="button" data-action="close-dialog">取消</button><button class="primary" type="submit">创建作品</button></div></form></dialog><dialog id="delete-dialog" aria-labelledby="delete-heading"><h2 id="delete-heading">删除这个作品？</h2><p id="delete-title"></p><p class="hint delete-note">文案、制作记录及未被其他作品使用的素材会一并删除，删除后无法恢复。</p><div class="row end"><button data-action="cancel-delete">取消</button><button class="destructive" data-action="confirm-delete">确认删除</button></div></dialog><dialog id="style-preview-dialog" aria-labelledby="style-preview-title"><div class="row between"><h2 id="style-preview-title">教育图解 · 15 秒效果</h2><button data-action="close-style-preview" aria-label="关闭风格预览">关闭</button></div><video id="style-preview-video" controls playsinline preload="metadata"></video><p class="hint">风格示例，制作时会替换为你的文案内容。</p></dialog><input type="file" id="image-upload" accept="image/png,image/jpeg,image/webp" hidden><script type="module" src="/app.js"></script></body>
</html>
